<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Página no encontrada | Credisnet</title>
  <style>
    :root{color-scheme:dark;--bg:#060f1e;--card:#0d1b2e;--line:#243650;--text:#f5f7fb;--muted:#aebbd0;--accent:#27d17f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#15345d 0,transparent 38%),var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);padding:24px}
    main{width:min(680px,100%);padding:48px;border:1px solid var(--line);border-radius:24px;background:rgba(13,27,46,.92);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
    img{width:190px;height:auto;margin-bottom:24px}strong{display:block;font-size:clamp(4rem,16vw,8rem);line-height:.9;color:var(--accent)}h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:20px 0 12px}p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 auto 28px;max-width:520px}a{display:inline-flex;padding:14px 22px;border-radius:999px;background:var(--accent);color:#04130c;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <img id="logo" alt="Credisnet">
    <strong>404</strong>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar desactualizado o la dirección fue escrita incorrectamente.</p>
    <a id="home" href="./">Volver al inicio</a>
  </main>
  <script>
    (() => {
      const githubPages = location.hostname.endsWith('.github.io');
      const firstSegment = location.pathname.split('/').filter(Boolean)[0];
      const base = githubPages && firstSegment ? `/${firstSegment}/` : '/';
      document.getElementById('home').href = base;
      document.getElementById('logo').src = `${base}img/logo.png`;
    })();
  </script>
</body>
</html>
